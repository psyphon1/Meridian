name: Feature request
description: Propose a new capability for Meridian
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Per docs/DEVELOPER_STANDARDS.md, every feature begins with an issue + acceptance
        criteria. Architecture changes additionally require an ADR (docs/adr/).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user pain or gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Concrete behavior, not just a goal.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable, observable conditions that define "done" (Gherkin `Given/When/Then` preferred).
      placeholder: "Given …\nWhen …\nThen …"
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Success metrics
      description: How will we know it worked? (latency, acceptance rate, precision, cost, etc.)
  - type: dropdown
    id: risk
    attributes:
      label: Risk tier
      description: Does this touch security, sandbox, evidence gate, or data deletion?
      options: ["critical", "high", "medium", "low"]
    validations:
      required: true
  - type: checkboxes
    id: adr
    attributes:
      label: Architecture impact
      options:
        - label: Requires an ADR (docs/PROJECT_STRUCTURE.md rule 9)
