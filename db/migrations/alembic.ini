[alembic]
# Run from the repository root:  alembic -c db/migrations/alembic.ini upgrade head
script_location = %(here)s
# Repo root on sys.path so env.py can import `packages.*` (relative to the cwd).
prepend_sys_path = .
# The database URL is NOT set here — env.py resolves it (see db/migrations/env.py).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname = root

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
