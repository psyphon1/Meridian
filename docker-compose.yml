# Meridian — local development services.
#
# Quick start (backing stores only, per docs/SETUP.md):
#     docker compose up -d postgres redis
#
# Full app stack (after Phase 1 code + infra/docker/*.Dockerfile exist):
#     docker compose --profile app up --build
#
# Staging/production run on Kubernetes (infra/kubernetes) — compose is dev-only.

name: meridian

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: meridian-postgres
    environment:
      POSTGRES_USER: meridian
      POSTGRES_PASSWORD: meridian
      POSTGRES_DB: meridian
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian -d meridian"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: meridian-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: [".env"]
    environment:
      DATABASE_URL: postgresql+psycopg://meridian:meridian@postgres:5432/meridian
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "8000:8000"

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    env_file: [".env"]
    environment:
      DATABASE_URL: postgresql+psycopg://meridian:meridian@postgres:5432/meridian
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    env_file: [".env"]
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:

