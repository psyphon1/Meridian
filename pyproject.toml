# Meridian — Autonomous AI PR Reviewer
# Python 3.12+ project configuration (API, worker, services, packages).
# Single source of truth for Python dependencies and tooling. See docs/CODE_STANDARDS.md.
#
#   make setup   # create .venv and install ".[dev]"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian"
version = "0.1.0"
description = "Meridian — Autonomous AI PR Reviewer. Your autonomous first-pass senior engineer for every GitHub pull request."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Chinmay Duse" }]
keywords = ["code-review", "pull-request", "llm", "github-app", "byok", "static-analysis"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

# Runtime dependencies. Ranges here are the contract; pin exactly in a lockfile at
# Phase 1 (CODE_STANDARDS §5). CI + SBOM enforce supply-chain hygiene (OpenSSF/NIST SSDF).
dependencies = [
  # API / web
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  # Data (PostgreSQL 16 + pgvector, Redis)
  "sqlalchemy[asyncio]>=2.0.52,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pgvector>=0.3,<1",
  "redis>=5.0,<6",
  # Orchestration / reasoning
  "langgraph>=0.2,<1",
  "litellm>=1.40,<2",
  # GitHub integration
  "httpx>=0.27,<1",
  "PyJWT>=2.8,<3",
  "cryptography>=42,<45",
  # Observability / logging (OBSERVABILITY.md)
  "structlog>=24.1,<25",
  "opentelemetry-api>=1.24,<2",
  "opentelemetry-sdk>=1.24,<2",
  "opentelemetry-exporter-otlp>=1.24,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5.0,<6",
  "ruff>=0.4,<1",
  "mypy>=1.10,<2",
  "types-redis>=4.6",
  "pre-commit>=3.7,<4",
]
security = [
  "semgrep>=1.70,<2",
]
kms = [
  "boto3>=1.34,<2",
]

# Code lands under apps/, packages/, services/ in Phase 1 (PROJECT_STRUCTURE.md §1).
# Until then this is an empty-package install so `pip install -e ".[dev]"` still works.
[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps", "packages", "services"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S", "T20"]
ignore = ["S101", "T201"]  # S101: pytest asserts; T201: print — revisit before prod

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["litellm.*", "langgraph.*", "psycopg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
markers = [
  "unit: fast, no external I/O",
  "integration: requires docker-compose backing services",
  "security: security-focused test suite",
  "e2e: full-system tests",
]

[tool.coverage.run]
source = ["apps", "packages", "services"]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

